name: Notion Sync

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/notion_sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: dc52b4d9b48a4f95ae570e6af9e0a113
